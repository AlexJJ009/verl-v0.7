repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.2"
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--output-format=full"]
        exclude: ^(?:\.claude/skills/|.*\.ipynb$)
      - id: ruff-format
        exclude: ^\.claude/skills/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.17.0"
    hooks:
      - id: mypy
        exclude: ^\.claude/skills/

  - repo: local
    hooks:
      - id: autogen-trainer-cfg
        name: Generate and verify verl/trainer/config/_generated_*.yaml
        entry: scripts/generate_trainer_config.sh
        language: script
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-docstrings
        name: Check doc string coverage
        entry: python3 tests/special_sanity/check_docstrings.py
        language: python
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-license
        name: Check license
        entry: python3 tests/special_sanity/check_license.py --directories examples scripts tests verl setup.py
        language: python
        pass_filenames: false

  - repo: local
    hooks:
      - id: compileall
        name: Compile all python files
        entry: sh -c 'PYTHONWARNINGS=error python3 -m compileall -q . -x "(^|[\\/])(\.venv|venv|\.git)([\\/]|$)"'
        language: python
        pass_filenames: false

  - repo: local
    hooks:
      - id: sft-loss-mask-gate
        name: Validate SFT chat-template and loss-mask invariants
        entry: bash scripts/run_sft_loss_mask_gate.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
