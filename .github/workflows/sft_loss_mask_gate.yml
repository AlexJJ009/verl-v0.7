name: sft_loss_mask_gate

on:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "verl/utils/dataset/multiturn_sft_dataset.py"
      - "verl/utils/chat_template.py"
      - "verl/trainer/config/sft_trainer_engine.yaml"
      - "recipe/**/run_sft*.sh"
      - "recipe/**/experiment_manifest/*.yaml"
      - "recipe"
      - "scripts/check_sft_loss_mask_policy.py"
      - "scripts/validate_sft_loss_mask.py"
      - "scripts/run_sft_loss_mask_gate.sh"
      - "tests/utils/dataset/test_multiturn_sft_dataset_qwen_thinking_on_cpu.py"
      - "tests/special_sanity/sft_input_ids_mismatch_allowlist.json"
      - ".github/workflows/sft_loss_mask_gate.yml"
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "verl/utils/dataset/multiturn_sft_dataset.py"
      - "verl/utils/chat_template.py"
      - "verl/trainer/config/sft_trainer_engine.yaml"
      - "recipe/**/run_sft*.sh"
      - "recipe/**/experiment_manifest/*.yaml"
      - "recipe"
      - "scripts/check_sft_loss_mask_policy.py"
      - "scripts/validate_sft_loss_mask.py"
      - "scripts/run_sft_loss_mask_gate.sh"
      - "tests/utils/dataset/test_multiturn_sft_dataset_qwen_thinking_on_cpu.py"
      - "tests/special_sanity/sft_input_ids_mismatch_allowlist.json"
      - ".github/workflows/sft_loss_mask_gate.yml"

permissions:
  contents: read

jobs:
  sft_loss_mask_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.10"
      - name: Install CPU test environment
        run: |
          pip3 install torch --index-url https://download.pytorch.org/whl/cpu
          pip3 install -r requirements.txt
          pip3 install -r requirements-test.txt
          pip3 install --no-deps -e .
      - name: Run fail-closed SFT loss-mask gate
        run: bash scripts/run_sft_loss_mask_gate.sh
